<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Erradicar reinicios automáticos involuntarios causados por el cliente de desarrollo en móviles e iframes
      if (typeof window !== 'undefined') {
        // Interceptamos la ruta de ping interno de Vite para que nunca dispare location.reload() en segundo plano
        const _origFetch = window.fetch;
        window.fetch = function(...args) {
          const firstArg = args[0];
          const url = typeof firstArg === 'string' ? firstArg : (firstArg && firstArg.url);
          if (typeof url === 'string' && url.includes('__vite_ping')) {
            // Mantenemos la promesa en espera limpia sin error para evitar que pingServer() llame a reload()
            return new Promise(() => {});
          }
          return _origFetch.apply(this, args);
        };
      }
    </script>
    <title>Plato Económico - Almuerzos al Menor Costo</title>
    <meta name="description" content="App para estudiantes y familias con presupuesto ajustado: elegí lo que tenés en casa, armá tu almuerzo con costo estimado y generá la lista exacta de lo que falta comprar." />
    <meta property="og:title" content="Plato Económico - Almuerzos al Menor Costo" />
    <meta property="og:description" content="Aprovechá lo que tenés en la alacena, calculá el costo por porción y generá la lista de compras exacta." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
